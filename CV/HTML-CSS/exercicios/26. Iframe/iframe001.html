<!DOCTYPE html>
<html lang="pt-br
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de iframe</title>
    <style>
        iframe{
            width: 400px;
            height: 400px;
        }
    </style>
</head>
<body>
    <h1>Testando o uso de um iframe</h1>
    <p>Acessando o site do 

        <!--Tamanho padrão do iframe é de 300x150px-->
        <iframe src="https://www.cursoemvideo.com" frameborder="1">
            <a href="https://www.cursoemvideo.com" target="_blank"></a>
        </iframe>
        CursoemVídeo</a> para aprender a programar.</p>

        <p>O site do 
            <iframe src="https://www.google.com.br" frameborder="1">
                <a href="https://www.google.com.br" target="_blank"></a>
            </iframe> também é muito legal.</p> <!--alguns sites bloqueiam o uso de iframe, como é o caso do google neste exemplo-->

        <p>O repositório do 
            <iframe src="https://gustavoguanabara.github.io" frameborder="1">
                <a href="https://gustavoguanabara.github.io" target="_blank"></a>
            </iframe> também é muito legal.</p>
</body>
</html>
